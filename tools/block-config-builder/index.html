  const { refreshWorkspace = true, preserveFocus = false } = options;
  rebuildTagRegistry();
  const { result, errors } = buildMergedConfig();
  const exportResult = applyExportMode(result);
  els.preview.innerHTML = highlightJson(safeStringify(exportResult, 2));
  els.summary.textContent = summarizeRules(exportResult);
  els.errors.hidden = errors.length === 0;
  els.errors.textContent = errors.length ? errors.join('\n') : '';

  if (refreshWorkspace) {
    renderWorkspacePreserveFocus(preserveFocus);
  }
}

function captureFocusedField() {
  const active = document.activeElement;
  if (!(active instanceof HTMLInputElement || active instanceof HTMLTextAreaElement || active instanceof HTMLSelectElement)) return null;
  if (!active.dataset.blockId || !active.dataset.fieldPath) return null;
  return {
    blockId: active.dataset.blockId,
    fieldPath: active.dataset.fieldPath,
    role: active.dataset.role || '',
    selectionStart: 'selectionStart' in active ? active.selectionStart : null,
    selectionEnd: 'selectionEnd' in active ? active.selectionEnd : null,
  };
}

function restoreFocusedField(snapshot) {
  if (!snapshot) return;
  requestAnimationFrame(() => {
    const selector = `[data-block-id="${CSS.escape(snapshot.blockId)}"][data-field-path="${CSS.escape(snapshot.fieldPath)}"]${snapshot.role ? `[data-role="${CSS.escape(snapshot.role)}"]` : ''}`;
    const next = els.blocks.querySelector(selector);
    if (!(next instanceof HTMLInputElement || next instanceof HTMLTextAreaElement || next instanceof HTMLSelectElement)) return;
    next.focus();
    if ('setSelectionRange' in next && snapshot.selectionStart !== null && snapshot.selectionEnd !== null) {
      next.setSelectionRange(snapshot.selectionStart, snapshot.selectionEnd);
    }
  });
}

function renderWorkspacePreserveFocus(shouldRestore) {
  const snapshot = shouldRestore ? captureFocusedField() : null;
  renderWorkspace();
  if (shouldRestore) restoreFocusedField(snapshot);
}

function scrollPreviewToCurrentStep() {
  const step = getCurrentStep();
  if (!step.rootPath) return;
  const anchor = `"${step.rootPath}"`;
  const index = els.preview.textContent.indexOf(anchor);
  if (index <= 0) {
    els.preview.scrollTop = 0;
    return;
  }
  const ratio = index / Math.max(els.preview.textContent.length, 1);
  els.preview.scrollTop = ratio * els.preview.scrollHeight;
}

function bindGlobalActions() {
  els.stepPrev.onclick = () => gotoStep(state.wizard.currentStep - 1);
  els.stepNext.onclick = async () => {
    const ok = await runStepPrecheck();
    if (!ok) return;
    gotoStep(state.wizard.currentStep + 1);
  };
  els.diffOnlyToggle.onchange = () => {
    state.exportDiffOnly = els.diffOnlyToggle.checked;
    rerenderOutput({ refreshWorkspace: false });
  };

  els.importBtn.onclick = () => {
    els.importJsonInput.value = '';
    els.importDialog.showModal();
  };
  els.importApply.onclick = async (event) => {
    event.preventDefault();
    try {
      await importConfig(els.importJsonInput.value);
      els.importDialog.close();
    } catch (error) {
      els.errors.hidden = false;
      els.errors.textContent = `導入失敗: ${error.message}`;
    }
  };

  els.reset.onclick = () => {
    state.blocksData = [];
    state.errors = [];
    renderWorkspace();
    rerenderOutput();
  };

  els.copy.onclick = async () => {
    const { result } = buildMergedConfig();
    await navigator.clipboard.writeText(safeStringify(applyExportMode(result), 2));
    els.copy.textContent = '已複製';
    setTimeout(() => (els.copy.textContent = '複製 JSON'), 1200);
  };

  els.download.onclick = () => {
    const { result } = buildMergedConfig();
    const blob = new Blob([safeStringify(applyExportMode(result), 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'config.json';
    a.click();
    URL.revokeObjectURL(url);
  };
}

async function normalizeImportedConfig(config) {
  const shouldUseRemoteLint = new URLSearchParams(location.search).get('remote_lint') === '1';
  if (shouldUseRemoteLint) {
    try {
      const resp = await fetch('/tools/lint-config', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify(config),
      });
      if (resp.ok) {
        const payload = await resp.json();
        if (payload?.config && typeof payload.config === 'object') return payload.config;
      }
    } catch {
      // Ignore backend transport errors and fallback to local normalization.
    }
  }
  const draft = structuredClone(config);
  const lintErrors = [];
  migrateLegacy14(draft, lintErrors);
  enforceRootWhitelist(draft, lintErrors);
  return draft;
}

function applyExportMode(config) {
  if (!state.exportDiffOnly) return config;
  const defaults = state.sharedDefs?.recommended_base_config || {};
  return diffAgainstDefaults(config, defaults);
}

function diffAgainstDefaults(current, defaults) {
  if (Array.isArray(current)) return current.map((item) => diffAgainstDefaults(item, null));
  if (!current || typeof current !== 'object') return current;
  const out = {};
  for (const [key, value] of Object.entries(current)) {
    const base = defaults && typeof defaults === 'object' ? defaults[key] : undefined;
    const next = diffAgainstDefaults(value, base);
    if (JSON.stringify(next) !== JSON.stringify(base)) out[key] = next;
  }
  return out;
}

function safeStringify(value, spaces = 0) {
  try {
    return JSON.stringify(value, null, spaces);
  } catch {
    return '{}';
  }
}

function escapeHtml(s) {
  return String(s)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#39;');
}

function highlightJson(json) {
  return escapeHtml(json)
    .replace(/"(\\u[0-9a-fA-F]{4}|\\[^u]|[^\\"])*"(?=\s*:)/g, '<span class="tok-key">$&</span>')
    .replace(/"(\\u[0-9a-fA-F]{4}|\\[^u]|[^\\"])*"/g, '<span class="tok-str">$&</span>')
    .replace(/\b(true|false)\b/g, '<span class="tok-bool">$1</span>')
    .replace(/\bnull\b/g, '<span class="tok-null">null</span>')
    .replace(/\b-?\d+(?:\.\d+)?(?:[eE][+\-]?\d+)?\b/g, '<span class="tok-num">$&</span>');
}
</script>
</body>
