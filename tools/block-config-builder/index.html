<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>sing-box Block Config Builder</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --panel: #141b2d;
      --panel-2: #1b2440;
      --border: #2b3557;
      --text: #e9edf8;
      --muted: #9ea9c7;
      --accent: #3f8cff;
      --danger: #ff5d73;
      --ok: #2ecc71;
      --warn: #ffb020;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(circle at 0 0, #151f3b, var(--bg));
      color: var(--text);
      min-height: 100vh;
    }
    .layout {
      display: grid;
      grid-template-columns: 280px minmax(540px, 1fr) 420px;
      min-height: 100vh;
      gap: 12px;
      padding: 12px;
    }
    .panel {
      background: color-mix(in oklab, var(--panel) 92%, black);
      border: 1px solid var(--border);
      border-radius: 12px;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .panel h2 {
      margin: 0;
      font-size: 14px;
      font-weight: 700;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      letter-spacing: .01em;
    }
    .panel-content { padding: 12px; overflow: auto; }
    .wizard-box {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 12px;
      background: #111a30;
    }
    .wizard-box h3 { margin: 0 0 8px; font-size: 13px; }
    .wizard-grid { display: grid; gap: 8px; }
    .wizard-summary {
      border-top: 1px solid var(--border);
      padding: 10px 12px;
      font-size: 12px;
      color: #b8d4ff;
      background: #101a2e;
      white-space: pre-wrap;
    }
    .module-group { margin-bottom: 12px; }
    .module-group h3 {
      margin: 0 0 8px;
      font-size: 12px;
      text-transform: uppercase;
      color: var(--muted);
      letter-spacing: .06em;
    }
    .library-btn, .btn {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 6px;
      text-align: left;
      cursor: pointer;
      font-size: 13px;
    }
    .library-btn:hover, .btn:hover { border-color: var(--accent); }
    .workspace-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      border-bottom: 1px solid var(--border);
      gap: 10px;
    }
    .workspace-header .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn {
      width: auto;
      margin: 0;
      font-weight: 600;
      padding: 8px 12px;
      text-align: center;
    }
    .btn.primary { background: var(--accent); border-color: transparent; }
    .wizard-steps {
      display: grid;
      grid-template-columns: repeat(11, minmax(0, 1fr));
      gap: 6px;
      padding: 10px 12px 0;
    }
    .step-pill {
      border: 1px solid var(--border);
      background: #111a30;
      color: #9fb0d8;
      border-radius: 8px;
      padding: 7px 6px;
      text-align: center;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .step-pill.active {
      background: #1f3466;
      border-color: var(--accent);
      color: #e5efff;
    }
    .step-nav {
      display: flex;
      gap: 8px;
      padding: 8px 12px 0;
    }
    .btn.danger { background: color-mix(in srgb, var(--danger) 20%, #2a0d14); border-color: color-mix(in srgb, var(--danger) 50%, var(--border)); }
    .blocks { padding: 12px; overflow: auto; display: flex; flex-direction: column; gap: 12px; }
    .blocks.generating { opacity: .5; pointer-events: none; }
    .blocks.fade-in { animation: workspace-fade-in .28s ease; }
    @keyframes workspace-fade-in {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .empty { border: 1px dashed var(--border); border-radius: 10px; padding: 18px; color: var(--muted); text-align: center; }
    .block {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: color-mix(in oklab, var(--panel-2) 92%, black);
      padding: 10px;
      cursor: grab;
    }
    .block.drag-over { border-color: var(--accent); }
    .block-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }
    .title { font-size: 14px; font-weight: 700; }
    .title-row { display: flex; align-items: center; gap: 6px; }
    .help-dot {
      width: 16px;
      height: 16px;
      border-radius: 999px;
      border: 1px solid var(--border);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: #c8dafc;
      background: #12203f;
      cursor: help;
    }
    .meta { color: var(--muted); font-size: 12px; }
    .controls { display: flex; align-items: center; gap: 8px; }
    .toggle { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
    .delete { border: 1px solid color-mix(in srgb, var(--danger) 70%, var(--border)); background: transparent; color: var(--danger); border-radius: 8px; padding: 4px 8px; cursor: pointer; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(190px,1fr)); gap: 10px; }
    .schema-tree { display: flex; flex-direction: column; gap: 10px; }
    .nested-panel {
      --depth: 1;
      border: 1px solid var(--border);
      border-left: 3px solid color-mix(in srgb, var(--accent) calc(35% + min(var(--depth), 6) * 8%), var(--border));
      border-radius: 10px;
      padding: 10px;
      background: color-mix(in oklab, var(--panel-2) calc(90% - min(var(--depth), 6) * 6%), white);
    }
    .nested-panel > legend {
      padding: 0 6px;
      font-size: 12px;
      color: #bdd5ff;
    }
    .path-chip {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label { font-size: 12px; color: var(--muted); }
    .field input, .field select, .field textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #0e1529;
      color: var(--text);
      padding: 8px;
      font-size: 13px;
    }
    .field textarea { min-height: 80px; resize: vertical; }
    .field .hint { font-size: 11px; color: var(--muted); }
    .field-error { color: #ff9cab; font-size: 11px; }
    .field.invalid input, .field.invalid textarea, .field.invalid select, .field.invalid .tag-input {
      border-color: var(--danger);
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--danger) 50%, transparent);
    }
    .label-row { display: flex; align-items: center; gap: 6px; }
    .switch {
      position: relative;
      width: 42px;
      height: 24px;
      border-radius: 999px;
      background: #243155;
      border: 1px solid var(--border);
      transition: background .18s ease;
      cursor: pointer;
    }
    .switch > input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      margin: 0;
    }
    .switch::after {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      top: 2px;
      left: 3px;
      background: #e6ebf8;
      transition: transform .18s ease;
    }
    .switch.on { background: color-mix(in srgb, var(--accent) 65%, #0f2145); }
    .switch.on::after { transform: translateX(17px); }
    .tag-input {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #0e1529;
      padding: 6px;
      min-height: 40px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 999px;
      background: #22355f;
      color: #dbe7ff;
      font-size: 12px;
    }
    .tag button {
      border: 0;
      background: transparent;
      color: #adc4f2;
      cursor: pointer;
      font-size: 12px;
      line-height: 1;
      padding: 0;
    }
    .tag-input-editor {
      flex: 1;
      min-width: 120px;
      border: 0;
      background: transparent;
      color: var(--text);
      outline: none;
      padding: 4px;
      font-size: 13px;
    }
    .array-object-container {
      border: 1px dashed var(--border);
      border-radius: 10px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #0f1830;
    }
    .array-object-toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .array-item {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #13203d;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      cursor: grab;
    }
    .array-item.drag-over { border-color: var(--accent); }
    .array-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #c8dafc;
    }
    .array-item-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill,minmax(180px,1fr));
      gap: 8px;
    }
    .array-empty {
      font-size: 12px;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 10px;
      text-align: center;
    }
    .error-panel {
      border-top: 1px solid var(--border);
      padding: 10px 12px;
      background: #2a1218;
      color: #ffb7c2;
      font-size: 12px;
      max-height: 160px;
      overflow: auto;
      white-space: pre-wrap;
    }
    .preview { margin: 0; padding: 12px; overflow: auto; font-size: 12px; line-height: 1.45; }
    .tok-key { color: #9cdcfe; }
    .tok-str { color: #ce9178; }
    .tok-num { color: #b5cea8; }
    .tok-bool { color: #569cd6; }
    .tok-null { color: #569cd6; }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="panel" id="library-panel">
      <h2>Schema 資源庫</h2>
      <div class="panel-content">
        <div id="wizard"></div>
        <div id="library"></div>
      </div>
    </aside>

    <section class="panel">
      <div class="wizard-steps" id="wizard-steps"></div>
      <div class="step-nav">
        <button class="btn" id="step-prev-btn">← 上一步</button>
        <button class="btn primary" id="step-next-btn">下一步 →</button>
      </div>
      <div class="workspace-header">
        <div>
          <strong>Block 工作區</strong>
          <div class="meta">新增、拖拽排序、啟用 / 停用模塊</div>
        </div>
        <div class="actions">
          <button class="btn" id="import-btn">導入 JSON</button>
          <button class="btn danger" id="reset-btn">重置全部塊</button>
        </div>
      </div>
      <div class="blocks" id="blocks"></div>
      <div class="error-panel" id="errors" hidden></div>
    </section>

    <aside class="panel">
      <div class="workspace-header">
        <div>
          <strong>JSON 預覽</strong>
          <div class="meta">即時合併結果</div>
        </div>
        <div class="actions">
          <label class="toggle"><input type="checkbox" id="diff-only-toggle">僅差異導出</label>
          <button class="btn" id="copy-btn">複製 JSON</button>
          <button class="btn primary" id="download-btn">下載 config.json</button>
        </div>
      </div>
      <div class="wizard-summary" id="rule-summary">規則摘要：尚未配置向導場景。</div>
      <pre class="preview" id="preview"></pre>
    </aside>
  </div>
  <dialog id="import-dialog">
    <form method="dialog" style="display:flex;flex-direction:column;gap:10px;min-width:560px;max-width:70vw;">
      <strong>導入現有 JSON</strong>
      <textarea id="import-json-input" style="min-height:220px;background:#0e1529;color:#e9edf8;border:1px solid #2b3557;border-radius:8px;padding:8px;" placeholder='{"log":{"level":"info"}}'></textarea>
      <div style="display:flex;justify-content:flex-end;gap:8px;">
        <button class="btn" value="cancel">取消</button>
        <button class="btn primary" id="import-apply-btn" value="default">導入並解構</button>
      </div>
    </form>
  </dialog>

<script type="module">
const state = {
  schemas: new Map(),
  blocksData: [],
  errors: [],
  sharedDefs: {},
  exportDiffOnly: false,
  wizard: {
    currentStep: 0,
  },
  tagRegistry: {},
};

const ARRAY_BUCKETS = {
  inbound: 'inbounds',
  outbound: 'outbounds',
  dns: 'dns',
  route: 'route',
  endpoint: 'endpoints',
  service: 'services'
};

const ROOT_ALLOWED_KEYS = new Set();

const ROOT_SHARED_KEYS = [];
const SHARED_PAGE_TO_PROPERTY = {
  tls: 'tls',
  multiplex: 'multiplex',
  mux: 'multiplex',
  multipath: 'multipath',
  'v2ray-transport': 'transport',
};

const KNOWN_SCHEMA_FILES = [
  'certificate.json','dns.json','endpoint.json','experimental.json','inbound.json','log.json','ntp.json','outbound.json','route.json','rule-set.json','service.json','shared.json'
];

const ENUM_FIELD_OPTIONS = {};
const FIELD_TYPE_OVERRIDES = {
  uuid: 'string',
  source_ip_cidr: 'array_string',
  ip_cidr: 'array_string',
  destination_ip_cidr: 'array_string',
  ip_version: 'array_integer',
  query_type: 'array_string',
  domain_suffix: 'array_string',
  server: 'string',
  server_name: 'string',
  public_key: 'string',
  private_key: 'string',
  inet4_range: 'string',
  inet6_range: 'string',
};

const WIZARD_STEPS = [
  { key: 'log', title: 'Step 1 · log', modules: ['log'], rootPath: 'log' },
  { key: 'ntp', title: 'Step 2 · ntp', modules: ['ntp'], rootPath: 'ntp' },
  { key: 'certificate', title: 'Step 3 · certificate & providers', modules: ['certificate'], rootPath: 'certificate' },
  { key: 'endpoint', title: 'Step 4 · endpoints', modules: ['endpoint'], rootPath: 'endpoints' },
  { key: 'inbound', title: 'Step 5 · inbounds', modules: ['inbound'], rootPath: 'inbounds' },
  { key: 'outbound', title: 'Step 6 · outbounds', modules: ['outbound'], rootPath: 'outbounds', templateButton: true },
  { key: 'dns', title: 'Step 7 · dns', modules: ['dns'], rootPath: 'dns' },
  { key: 'route', title: 'Step 8 · route', modules: ['route'], rootPath: 'route' },
  { key: 'service', title: 'Step 9 · services', modules: ['service'], rootPath: 'services' },
  { key: 'experimental', title: 'Step 10 · experimental', modules: ['experimental'], rootPath: 'experimental' },
  { key: 'review', title: 'Step 11 · preview & lint', modules: [], rootPath: '' },
];

const BLOCK_TYPE_REGISTRY = {
  'socks-in': { moduleName: 'inbound', pageId: 'socks', title: 'SOCKS Inbound', preset: { type: 'socks', tag: 'socks-in', listen: '127.0.0.1', listen_port: 1080 } },
  'http-in': { moduleName: 'inbound', pageId: 'http', title: 'HTTP Inbound', preset: { type: 'http', tag: 'http-in', listen: '127.0.0.1', listen_port: 8080 } },
  'mixed-in': { moduleName: 'inbound', pageId: 'mixed', title: 'Mixed Inbound', preset: { type: 'mixed', tag: 'mixed-in', listen: '127.0.0.1', listen_port: 2080 } },
  'dns-in': { moduleName: 'inbound', pageId: 'direct', title: 'DNS Inbound', preset: { type: 'dns', tag: 'dns-in', listen: '127.0.0.1', listen_port: 5353 } },
  'shadowsocks-in': { moduleName: 'inbound', pageId: 'shadowsocks', title: 'Shadowsocks Inbound', preset: { type: 'shadowsocks', tag: 'shadowsocks-in', listen: '0.0.0.0', listen_port: 8388 } },
  'direct-out': { moduleName: 'outbound', pageId: 'direct', title: 'Direct Outbound', preset: { type: 'direct', tag: 'direct-out' } },
};

const ARRAY_OBJECT_TEMPLATES = {
  'route_root.rule_set': [
    { id: 'remote', label: '遠端規則 (Remote Rule-Set)', payload: { type: 'remote', tag: '', format: 'binary', url: '', download_detour: '' } },
    { id: 'inline', label: '本地規則 (Inline Rule-Set)', payload: { type: 'inline', tag: '', format: 'source', rules: [] } },
  ],
  'dns_root.rules': [
    { id: 'server', label: '轉發規則 (Server)', payload: { server: '' } },
    { id: 'reject', label: '攔截規則 (Reject)', payload: { action: 'reject' } },
  ],
};

const ProjectLinter = {
  validateProject(config) {
    const errors = [];
    Object.keys(config || {}).forEach((key) => {
      if (!ROOT_ALLOWED_KEYS.has(key)) errors.push(`非法根級字段: ${key}`);
    });
    const ports = (config.inbounds || []).map((i) => i?.listen_port).filter((p) => Number.isInteger(p));
    const dup = ports.find((p, i) => ports.indexOf(p) !== i);
    if (dup) errors.push(`端口衝突：inbounds.listen_port ${dup} 重複`);
    return errors;
  },
};

const els = {
  wizard: document.getElementById('wizard'),
  wizardSteps: document.getElementById('wizard-steps'),
  stepPrev: document.getElementById('step-prev-btn'),
  stepNext: document.getElementById('step-next-btn'),
  library: document.getElementById('library'),
  blocks: document.getElementById('blocks'),
  preview: document.getElementById('preview'),
  errors: document.getElementById('errors'),
  summary: document.getElementById('rule-summary'),
  reset: document.getElementById('reset-btn'),
  importBtn: document.getElementById('import-btn'),
  copy: document.getElementById('copy-btn'),
  download: document.getElementById('download-btn'),
  diffOnlyToggle: document.getElementById('diff-only-toggle'),
  importDialog: document.getElementById('import-dialog'),
  importApply: document.getElementById('import-apply-btn'),
  importJsonInput: document.getElementById('import-json-input'),
};

await bootstrap();

async function bootstrap() {
  await loadSharedDefinitions();
  const schemaFiles = await discoverSchemaFiles();
  await Promise.all(schemaFiles.map(loadSchema));
  renderWizard();
  renderLibrary();
  renderWorkspace();
  rerenderOutput();
  bindGlobalActions();
  bindWorkspaceDelegation();
}

async function loadSharedDefinitions() {
  try {
    const resp = await fetch('/tools/core/schema_shared.json');
    const defs = await resp.json();
    state.sharedDefs = defs || {};
    for (const key of defs.root_allowed_keys || []) ROOT_ALLOWED_KEYS.add(key);
    ROOT_SHARED_KEYS.push(...(defs.root_shared_keys || []));
    Object.assign(ENUM_FIELD_OPTIONS, defs.enum_field_options || {});
    return;
  } catch {
    state.sharedDefs = {
      recommended_base_config: { log: { level: 'info', timestamp: true }, dns: { servers: [{ type: 'local', tag: 'local-dns' }], rules: [] }, route: { rules: [] } },
      ui_secure_defaults: { udp_over_tcp: true },
    };
    ['log', 'dns', 'ntp', 'certificate', 'certificate_providers', 'endpoints', 'inbounds', 'outbounds', 'route', 'services', 'experimental']
      .forEach((key) => ROOT_ALLOWED_KEYS.add(key));
    ROOT_SHARED_KEYS.push('tls', 'transport', 'v2ray_transport', 'multiplex', 'mux', 'multipath');
    Object.assign(ENUM_FIELD_OPTIONS, {
      method: ['none', 'aes-128-gcm', 'aes-256-gcm', 'chacha20-ietf-poly1305', '2022-blake3-aes-128-gcm', '2022-blake3-aes-256-gcm'],
      protocol: ['dns', 'http', 'tls', 'quic', 'stun', 'bittorrent'],
      level: ['trace', 'debug', 'info', 'warn', 'error', 'fatal', 'panic'],
    });
  }
}

function renderWizard() {
  const step = WIZARD_STEPS[state.wizard.currentStep];
  els.wizard.innerHTML = `
    <section class="wizard-box">
      <h3>11 步向導模式</h3>
      <div class="meta">${escapeHtml(step.title)}</div>
      <div class="wizard-grid">
        <div class="meta">遵循低耦合 → 高耦合順序；當前步驟新增的 tag 會注入全局 Tag Registry，供後續步驟下拉引用。</div>
        ${step.templateButton ? '<button class="btn" id="add-common-template">添加常見模板 (VLESS / Shadowsocks / Reality)</button>' : ''}
      </div>
    </section>
  `;
  const tplBtn = document.getElementById('add-common-template');
  if (tplBtn) {
    tplBtn.onclick = () => {
      addCommonOutboundsTemplate();
      renderWorkspace();
      rerenderOutput();
    };
  }
  renderStepIndicators();
}

function renderStepIndicators() {
  els.wizardSteps.innerHTML = '';
  WIZARD_STEPS.forEach((step, index) => {
    const node = document.createElement('button');
    node.className = `step-pill ${index === state.wizard.currentStep ? 'active' : ''}`;
    node.textContent = `${index + 1}.${step.key}`;
    node.onclick = () => gotoStep(index);
    els.wizardSteps.appendChild(node);
  });
}

function getCurrentStep() {
  return WIZARD_STEPS[state.wizard.currentStep];
}

function gotoStep(nextStep) {
  const target = Math.min(Math.max(nextStep, 0), WIZARD_STEPS.length - 1);
  state.wizard.currentStep = target;
  renderWizard();
  renderLibrary();
  renderWorkspace();
  rerenderOutput({ refreshWorkspace: false });
  scrollPreviewToCurrentStep();
}

async function runStepPrecheck() {
  const { result } = buildMergedConfig();
  const errors = ProjectLinter.validateProject(result);
  const cycleErrors = validateDetourCycles(result.outbounds || []);
  const combined = [...errors, ...cycleErrors];
  els.errors.hidden = combined.length === 0;
  els.errors.textContent = combined.join('\n');
  if (combined.length) return false;
  try {
    await normalizeImportedConfig(result);
  } catch {
    // ignore transport limitation for static preview.
  }
  return true;
}

function validateDetourCycles(outbounds) {
  const graph = new Map();
  const errors = [];
  outbounds.forEach((item) => {
    if (!item?.tag) return;
    graph.set(item.tag, item.detour ? String(item.detour) : '');
  });
  const visited = new Set();
  const stack = new Set();
  const dfs = (tag) => {
    if (stack.has(tag)) return true;
    if (visited.has(tag)) return false;
    visited.add(tag);
    stack.add(tag);
    const next = graph.get(tag);
    if (next && graph.has(next) && dfs(next)) return true;
    stack.delete(tag);
    return false;
  };
  graph.forEach((_, tag) => {
    if (dfs(tag)) errors.push(`detour 環路引用檢測到: ${tag}`);
  });
  return [...new Set(errors)];
}

function addCommonOutboundsTemplate() {
  const outboundSchema = state.schemas.get('outbound');
  if (!outboundSchema?.pages?.length) return;
  const push = (pageId, preset, title) => {
    const page = outboundSchema.pages.find((item) => item.page_id === pageId) || outboundSchema.pages[0];
    addBlockByPage('outbound', page, { ...preset, __title: title });
  };
  push('vless', { type: 'vless', tag: 'vless-out', server: 'example.com', server_port: 443 }, 'VLESS Template');
  push('shadowsocks', { type: 'shadowsocks', tag: 'ss-out', server: 'example.com', server_port: 443, method: 'aes-128-gcm' }, 'Shadowsocks Template');
  push('vless', { type: 'vless', tag: 'reality-out', server: 'example.com', server_port: 443, tls: { enabled: true, server_name: 'example.com', reality: { enabled: true, public_key: '', short_id: '' } } }, 'Reality Template');
}

async function discoverSchemaFiles() {
  try {
    const resp = await fetch('../../generated/configuration-schemas/');
    const html = await resp.text();
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const links = [...doc.querySelectorAll('a[href$=".json"]')].map(a => a.getAttribute('href'));
    const names = links.map(h => h.split('/').pop()).filter(Boolean);
    return [...new Set(names)].sort();
  } catch {
    return KNOWN_SCHEMA_FILES;
  }
}

async function loadSchema(filename) {
  const url = `../../generated/configuration-schemas/${filename}`;
  try {
    const text = await (await fetch(url)).text();
    const schema = JSON.parse(text);
    if (schema?.module && Array.isArray(schema.pages)) {
      state.schemas.set(schema.module, schema);
    }
  } catch (error) {
    state.errors.push(`Schema 載入失敗: ${filename} (${error.message})`);
  }
}

function renderLibrary() {
  const step = getCurrentStep();
  if (step.key === 'review') {
    els.library.innerHTML = '<div class="empty">終審步驟：請查看右側 JSON，執行 lint/check 後導出。</div>';
    return;
  }
  const modules = [...state.schemas.values()]
    .filter((schema) => ROOT_ALLOWED_KEYS.has(resolveRootKeyByModule(schema.module)))
    .filter((schema) => step.modules.includes(schema.module))
    .sort((a, b) => a.module.localeCompare(b.module));
  if (!modules.length) {
    els.library.innerHTML = '<div class="empty">找不到可用 Schema。</div>';
    return;
  }

  els.library.innerHTML = '';
  for (const module of modules) {
    const group = document.createElement('div');
    group.className = 'module-group';
    group.innerHTML = `<h3>${escapeHtml(module.module)}</h3>`;

    for (const page of module.pages) {
      const btn = document.createElement('button');
      btn.className = 'library-btn';
      btn.textContent = page.title || page.page_id;
      btn.onclick = () => {
        addBlockByPage(module.module, page);
        renderWorkspace();
        rerenderOutput();
      };
      group.appendChild(btn);
    }
    els.library.appendChild(group);
  }
}

function createBlock(moduleName, page, preset = {}) {
  const fields = structuredClone(page.fields || {});
  calibrateFieldSpecs(fields);
  const values = {};
  const basePayload = {};
  const secureDefaults = state.sharedDefs?.ui_secure_defaults || {};
  for (const [field, spec] of Object.entries(fields)) {
    values[field] = inferDefault(spec);
    if (Object.hasOwn(secureDefaults, field) && (values[field] === null || values[field] === '' || values[field] === false)) {
      values[field] = secureDefaults[field];
      basePayload[field] = secureDefaults[field];
    }
  }
  hydrateKnownFieldsFromPayload(values, fields, preset);
  extendFieldsWithUnknownPayload(fields, values, preset);
  Object.entries(preset).forEach(([key, val]) => {
    if (key === '__title') return;
    basePayload[key] = val;
    if (Object.hasOwn(values, key)) values[key] = structuredClone(val);
  });
  return {
    id: crypto.randomUUID(),
    moduleName,
    pageId: page.page_id,
    title: preset.__title || page.title || page.page_id,
    pageDescription: page.description || '',
    sourcePath: page.source_path,
    active: true,
    fields,
    values,
    basePayload,
    role: classifyBlockRole(moduleName, page),
    parentId: moduleName === 'shared' ? findPreferredSharedParentId() : null,
  };
}

function calibrateFieldSpecs(fields) {
  Object.entries(fields || {}).forEach(([path, spec]) => {
    const leaf = String(path).split('.').at(-1);
    if (!leaf || !spec || typeof spec !== 'object') return;
    const forcedType = FIELD_TYPE_OVERRIDES[leaf];
    if (forcedType) spec.type = forcedType;
  });
}

function classifyBlockRole(moduleName, page) {
  const sourcePath = String(page?.source_path || '');
  if (moduleName === 'dns') {
    if (sourcePath.includes('/dns/server/')) return 'dns_server';
    if (sourcePath.includes('/dns/rule')) return 'dns_rule';
    return 'dns_root';
  }
  if (moduleName === 'route') {
    if (sourcePath.includes('/route/rule')) return 'route_rule';
    return 'route_root';
  }
  return 'default';
}

function hydrateKnownFieldsFromPayload(values, fields, payload) {
  if (!payload || typeof payload !== 'object') return;
  Object.keys(fields || {}).forEach((path) => {
    const incoming = getNestedValue(payload, path);
    if (incoming !== undefined) setNestedValue(values, path, structuredClone(incoming));
  });
}

function extendFieldsWithUnknownPayload(fields, values, payload) {
  if (!payload || typeof payload !== 'object') return;
  Object.entries(payload).forEach(([key, val]) => {
    if (key.startsWith('__') || Object.hasOwn(fields, key)) return;
    if (typeof val === 'function') return;
    fields[key] = inferSpecFromValue(val);
    values[key] = structuredClone(val);
  });
}

function inferSpecFromValue(value) {
  if (Array.isArray(value)) {
    const first = value.find((item) => item !== null && item !== undefined);
    if (typeof first === 'number') return { type: 'array_integer', description: '逆向導入：自動識別陣列字段' };
    if (first && typeof first === 'object') return { type: 'array_object', description: '逆向導入：自動識別陣列字段' };
    return { type: 'array_string', description: '逆向導入：自動識別陣列字段' };
  }
  if (typeof value === 'boolean') return { type: 'boolean', description: '逆向導入：自動識別字段' };
  if (typeof value === 'number') return { type: 'integer', description: '逆向導入：自動識別字段' };
  if (value && typeof value === 'object') return { type: 'object', description: '逆向導入：保留原始對象' };
  return { type: 'string', description: '逆向導入：自動識別字段' };
}

function findPreferredSharedParentId() {
  for (let i = state.blocksData.length - 1; i >= 0; i -= 1) {
    const block = state.blocksData[i];
    if (block.moduleName === 'inbound' || block.moduleName === 'outbound' || block.moduleName === 'endpoint') {
      return block.id;
    }
  }
  return null;
}

function addBlockByPage(moduleName, page, preset = {}) {
  state.blocksData.push(createBlock(moduleName, page, preset));
}

function addBlock(type, initialData = {}) {
  const def = BLOCK_TYPE_REGISTRY[type];
  if (!def) return null;
  const module = state.schemas.get(def.moduleName);
  const page = module?.pages?.find(p => p.page_id === def.pageId) || module?.pages?.[0];
  if (!page) return null;
  const preset = { ...(def.preset || {}), ...initialData, __title: def.title };
  addBlockByPage(def.moduleName, page, preset);
  return state.blocksData[state.blocksData.length - 1];
}

function findBestPage(moduleName, payload, preferredPageId = '', strictPreferred = false) {
  const module = state.schemas.get(moduleName);
  const pages = module?.pages || [];
  if (!pages.length) return null;
  if (preferredPageId) {
    const direct = pages.find((p) => p.page_id === preferredPageId);
    if (direct) return direct;
    if (strictPreferred) return null;
  }
  if (payload?.type) {
    const byType = pages.find((p) => p.page_id === payload.type);
    if (byType) return byType;
  }

  let bestPage = pages[0];
  let bestScore = -1;
  for (const page of pages) {
    const fields = Object.keys(page.fields || {});
    const score = fields.reduce((acc, key) => acc + (Object.hasOwn(payload || {}, key) ? 1 : 0), 0);
    if (score > bestScore) {
      bestPage = page;
      bestScore = score;
    }
  }
  return bestPage;
}

function pushBlockFromPayload(moduleName, payload, preferredPageId = '', titleFallback = '', strictPreferred = false) {
  if (!payload || typeof payload !== 'object') return;
  const page = findBestPage(moduleName, payload, preferredPageId, strictPreferred);
  if (!page) return;
  const title = titleFallback || page.title || page.page_id;
  addBlockByPage(moduleName, page, { ...payload, __title: title });
}

function pushSharedBlocksFromParent(parentPayload, sharedTarget) {
  if (!parentPayload || typeof parentPayload !== 'object') return;
  Object.entries(SHARED_PAGE_TO_PROPERTY).forEach(([pageId, nestedKey]) => {
    const nested = parentPayload[nestedKey];
    if (!nested || typeof nested !== 'object') return;
    const page = findBestPage('shared', nested, pageId);
    if (!page) return;
    addBlockByPage('shared', page, { ...nested, __title: `↳ ${page.title || pageId}`, __sharedTarget: sharedTarget });
  });
}

function syncUIFromCurrentConfig(config) {
  if (!config || typeof config !== 'object') return;
  pushSingletonRootBlocks(config);
  const inbounds = Array.isArray(config.inbounds) ? config.inbounds : [];
  const outbounds = Array.isArray(config.outbounds) ? config.outbounds : [];
  const dnsServers = Array.isArray(config.dns?.servers) ? config.dns.servers : [];
  const dnsRules = Array.isArray(config.dns?.rules) ? config.dns.rules : [];
  const routeRules = Array.isArray(config.route?.rules) ? config.route.rules : [];
  const endpoints = Array.isArray(config.endpoints) ? config.endpoints : [];
  const services = Array.isArray(config.services) ? config.services : [];

  inbounds.forEach((inbound) => {
    const title = inbound?.type === 'tun' ? 'TUN Inbound' : '';
    pushBlockFromPayload('inbound', inbound, inbound?.type || '', title);
    pushSharedBlocksFromParent(inbound, 'inbound');
  });
  outbounds.forEach((outbound) => {
    pushBlockFromPayload('outbound', outbound, outbound?.type || '');
    pushSharedBlocksFromParent(outbound, 'outbound');
  });
  dnsServers.forEach((server) => {
    pushBlockFromPayload('dns', server, server?.type || 'server', 'DNS Server', true);
  });
  dnsRules.forEach((rule) => {
    const preferred = rule?.action ? 'rule_action' : 'rule';
    pushBlockFromPayload('dns', rule, preferred, 'DNS Rule', true);
  });
  routeRules.forEach((rule) => {
    const preferred = rule?.action ? 'rule_action' : 'rule';
    pushBlockFromPayload('route', rule, preferred, 'Routing Rule', true);
  });
  endpoints.forEach((endpoint) => {
    pushBlockFromPayload('endpoint', endpoint, endpoint?.type || '');
  });
  services.forEach((service) => {
    pushBlockFromPayload('service', service, service?.type || '');
  });
}

function pushSingletonRootBlocks(config) {
  const singletonModules = ['log', 'experimental', 'dns', 'route', 'ntp', 'certificate'];
  singletonModules.forEach((moduleName) => {
    const payload = config[moduleName];
    if (!payload || typeof payload !== 'object' || Array.isArray(payload)) return;
    const rootPayload = structuredClone(payload);
    if (moduleName === 'dns') {
      delete rootPayload.servers;
      delete rootPayload.rules;
    }
    if (moduleName === 'route') {
      delete rootPayload.rules;
    }
    if (Object.keys(rootPayload).length === 0) return;
    const preferredPage = moduleName === 'dns' ? 'dns' : (moduleName === 'route' ? 'route' : moduleName);
    pushBlockFromPayload(moduleName, rootPayload, preferredPage, preferredPage.toUpperCase());
  });
}

function inferDefault(spec) {
  if (spec?.default !== undefined) {
    if (typeof spec.default === 'string') return spec.default;
    return spec.default;
  }
  switch (spec?.type) {
    case 'string': return '';
    case 'integer': return 0;
    case 'boolean': return false;
    case 'array_integer':
    case 'array_string':
    case 'array_object': return [];
    case 'object': return {};
    default: return null;
  }
}

function renderWorkspace() {
  const step = getCurrentStep();
  const visibleBlocks = step.key === 'review'
    ? state.blocksData
    : state.blocksData.filter((block) => step.modules.includes(block.moduleName));

  if (!visibleBlocks.length) {
    els.blocks.innerHTML = '<div class="empty">從左側選擇任意 Schema 頁面以新增第一個 Block。</div>';
    return;
  }

  els.blocks.innerHTML = '';
  visibleBlocks.forEach((block) => {
    const index = state.blocksData.findIndex((item) => item.id === block.id);
    const card = document.createElement('article');
    card.className = 'block';
    card.draggable = true;
    card.dataset.index = String(index);

    const parentBlock = block.parentId ? state.blocksData.find((b) => b.id === block.parentId) : null;
    const scopeMeta = block.moduleName === 'shared'
      ? ` ↳ nested in ${parentBlock?.title || '未綁定主塊'}`
      : '';
    card.innerHTML = `
      <div class="block-header">
        <div>
          <div class="title-row">
            <div class="title">${escapeHtml(block.title)}</div>
            <span class="help-dot" title="${escapeHtml(block.pageDescription || block.sourcePath || '來源：sing-box schema 定義')}" aria-label="schema hint">?</span>
          </div>
          <div class="meta">${escapeHtml(block.moduleName)} · ${escapeHtml(block.sourcePath || block.pageId)}${escapeHtml(scopeMeta)}</div>
        </div>
        <div class="controls">
          ${block.moduleName === 'shared' ? '<label class="toggle">歸屬<select data-role="shared-target"><option value="outbound">outbound</option><option value="inbound">inbound</option></select></label>' : ''}
          <label class="toggle"><input type="checkbox" ${block.active ? 'checked' : ''} data-role="toggle">啟用</label>
          <button class="delete" data-role="delete">刪除</button>
        </div>
      </div>
      <div class="schema-tree"></div>
    `;

    bindDragHandlers(card);
    const treeRoot = card.querySelector('.schema-tree');
    generateUIFromSchema(treeRoot, block, block.fields, [resolveRootKeyByModule(block.moduleName), block.pageId], 0);

    els.blocks.appendChild(card);
  });
}

function generateUIFromSchema(container, block, fields, breadcrumb = [], depth = 0) {
  const tree = buildFieldTree(fields);
  tree.fields.forEach((leaf) => {
    container.appendChild(renderField(block, leaf.path, leaf.spec, depth, breadcrumb));
  });

  tree.groups.forEach((group, segment) => {
    const nestedPath = [...breadcrumb, segment];
    const panel = document.createElement('fieldset');
    panel.className = 'nested-panel';
    panel.style.setProperty('--depth', String(depth + 1));
    panel.innerHTML = `
      <legend>${escapeHtml(segment)}</legend>
      <div class="path-chip">${escapeHtml(nestedPath.join(' > '))}</div>
      <div class="schema-tree"></div>
    `;
    generateUIFromSchema(panel.querySelector('.schema-tree'), block, group, nestedPath, depth + 1);
    container.appendChild(panel);
  });
}

function buildFieldTree(fields) {
  const groups = new Map();
  const plainFields = [];
  Object.entries(fields || {}).forEach(([path, spec]) => {
    const segments = String(path).split('.');
    if (segments.length === 1) {
      plainFields.push({ path, spec });
      return;
    }
    const [head, ...rest] = segments;
    const restPath = rest.join('.');
    if (!groups.has(head)) groups.set(head, {});
    groups.get(head)[restPath] = spec;
  });
  return { fields: plainFields, groups };
}

function bindDragHandlers(card) {
  card.addEventListener('dragstart', (e) => {
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', card.dataset.index);
  });
  card.addEventListener('dragover', (e) => {
    e.preventDefault();
    card.classList.add('drag-over');
  });
  card.addEventListener('dragleave', () => card.classList.remove('drag-over'));
  card.addEventListener('drop', (e) => {
    e.preventDefault();
    card.classList.remove('drag-over');
    const from = Number(e.dataTransfer.getData('text/plain'));
    const to = Number(card.dataset.index);
    if (Number.isNaN(from) || Number.isNaN(to) || from === to) return;
    const [moved] = state.blocksData.splice(from, 1);
    state.blocksData.splice(to, 0, moved);
    renderWorkspace();
    rerenderOutput();
  });
}

function bindWorkspaceDelegation() {
  const normalizeAtomicArrayValue = (value, fieldType) => {
    if (fieldType === 'array_string') {
      if (Array.isArray(value)) return value.map((item) => String(item));
      if (value === '' || value === null || value === undefined) return [];
      return [String(value)];
    }
    if (fieldType === 'array_integer') {
      if (Array.isArray(value)) return value.map((item) => Number(item)).filter((item) => Number.isFinite(item));
      const next = Number(value);
      return Number.isFinite(next) ? [next] : [];
    }
    return value;
  };

  const handleFieldMutation = (target) => {
    const blockId = target.dataset.blockId;
    const fieldPath = target.dataset.fieldPath;
    if (!blockId || !fieldPath) return;
    const block = state.blocksData.find((item) => item.id === blockId);
    if (!block) return;
    const raw = readInputValue(target, target.dataset.fieldType);
    setNestedValue(block.values, fieldPath, normalizeAtomicArrayValue(raw, target.dataset.fieldType));
    rerenderOutput({ refreshWorkspace: false });
  };

  els.blocks.addEventListener('input', (event) => {
    const field = event.target.closest('[data-block-id][data-field-path]');
    if (!field) return;
    if (field.dataset.role === 'object-toggle' || field.dataset.role === 'tag-editor' || field.dataset.role === 'array-object-field') return;
    handleFieldMutation(field);
  });

  els.blocks.addEventListener('change', (event) => {
    const target = event.target;
    if (!(target instanceof HTMLInputElement || target instanceof HTMLSelectElement || target instanceof HTMLTextAreaElement)) return;
    if (target.dataset.role === 'tag-editor') return;
    const card = target.closest('.block');
    const index = Number(card?.dataset.index);
    const block = state.blocksData[index];

    if (target.dataset.role === 'object-toggle') {
      if (!block) return;
      if (!target.checked) {
        deleteNestedValue(block.values, target.dataset.fieldPath);
      } else if (getNestedValue(block.values, target.dataset.fieldPath) === undefined) {
        setNestedValue(block.values, target.dataset.fieldPath, {});
      }
      rerenderOutput({ refreshWorkspace: true, preserveFocus: true });
      return;
    }

    if (target.dataset.role === 'shared-target') {
      block.sharedTarget = target.value;
      rerenderOutput({ refreshWorkspace: false });
      return;
    }

    if (target.dataset.role === 'toggle') {
      if (!block) return;
      block.active = target.checked;
      rerenderOutput({ refreshWorkspace: false });
      return;
    }

    const field = target.closest('[data-block-id][data-field-path]');
    if (!field) return;
    if (target.dataset.role === 'array-object-field') {
      const blockId = target.dataset.blockId;
      const fieldPath = target.dataset.fieldPath;
      const itemIndex = Number(target.dataset.itemIndex);
      const itemKey = target.dataset.itemKey;
      const currentBlock = state.blocksData.find((item) => item.id === blockId);
      const list = currentBlock ? getNestedValue(currentBlock.values, fieldPath) : null;
      if (!currentBlock || !Array.isArray(list) || Number.isNaN(itemIndex) || !itemKey) return;
      const next = [...list];
      const nextItem = next[itemIndex] && typeof next[itemIndex] === 'object' ? { ...next[itemIndex] } : {};
      const raw = parseArrayObjectFieldValue(target.dataset.fieldType, target);
      nextItem[itemKey] = normalizeAtomicArrayValue(raw, target.dataset.fieldType);
      next[itemIndex] = nextItem;
      setNestedValue(currentBlock.values, fieldPath, next);
      rerenderOutput({ refreshWorkspace: true, preserveFocus: true });
      return;
    }
    handleFieldMutation(field);
  });

  els.blocks.addEventListener('click', (event) => {
    const target = event.target.closest('[data-role]');
    if (!target) return;
    const card = target.closest('.block');
    if (!card) return;
    const index = Number(card.dataset.index);
    const block = state.blocksData[index];
    if (!block) return;

    if (target.dataset.role === 'delete') {
      state.blocksData.splice(index, 1);
      renderWorkspace();
      rerenderOutput();
      return;
    }

    if (target.dataset.role === 'tag-remove') {
      const fieldPath = target.dataset.fieldPath;
      const chipIndex = Number(target.dataset.tagIndex);
      if (!fieldPath || Number.isNaN(chipIndex)) return;
      const value = getNestedValue(block.values, fieldPath);
      if (!Array.isArray(value)) return;
      value.splice(chipIndex, 1);
      setNestedValue(block.values, fieldPath, value);
      rerenderOutput({ refreshWorkspace: false });
      return;
    }

    if (target.dataset.role === 'array-object-add') {
      const fieldPath = target.dataset.fieldPath;
      if (!fieldPath) return;
      const list = getNestedValue(block.values, fieldPath);
      const fieldSpec = block.fields?.[fieldPath] || {};
      const templates = getArrayObjectTemplates(block, fieldPath);
      const select = card.querySelector(`[data-role="array-template-select"][data-field-path="${CSS.escape(fieldPath)}"]`);
      const selectedId = select?.value;
      const tpl = templates.find((item) => item.id === selectedId) || templates[0];
      const nextItem = structuredClone(tpl?.payload || buildArrayItemFromSchema(fieldSpec));
      const next = Array.isArray(list) ? [...list, nextItem] : [nextItem];
      setNestedValue(block.values, fieldPath, next);
      rerenderOutput({ refreshWorkspace: true });
      return;
    }

    if (target.dataset.role === 'array-object-delete') {
      const fieldPath = target.closest('.array-item')?.dataset.fieldPath;
      const itemIndex = Number(target.dataset.itemIndex);
      const list = getNestedValue(block.values, fieldPath);
      if (!fieldPath || !Array.isArray(list) || Number.isNaN(itemIndex)) return;
      const next = [...list];
      next.splice(itemIndex, 1);
      setNestedValue(block.values, fieldPath, next);
      rerenderOutput({ refreshWorkspace: true });
      return;
    }

  });

  els.blocks.addEventListener('keydown', (event) => {
    const target = event.target;
    if (!(target instanceof HTMLInputElement) || target.dataset.role !== 'tag-editor') return;
    if (!(event.key === 'Enter' || event.key === ',')) return;
    event.preventDefault();
    const fieldPath = target.dataset.fieldPath;
    const blockId = target.dataset.blockId;
    if (!fieldPath || !blockId) return;
    const block = state.blocksData.find((item) => item.id === blockId);
    if (!block) return;
    const raw = target.value.trim().replace(/,$/, '');
    if (!raw) return;
    const type = target.dataset.fieldType;
    const validationError = validateTagChipInput(fieldPath, raw);
    if (validationError) {
      els.errors.hidden = false;
      els.errors.textContent = validationError;
      return;
    }
    const nextValue = type === 'array_integer' ? Number(raw) : raw;
    if (type === 'array_integer' && !Number.isFinite(nextValue)) return;
    const list = getNestedValue(block.values, fieldPath);
    const normalized = Array.isArray(list) ? [...list] : [];
    normalized.push(nextValue);
    setNestedValue(block.values, fieldPath, normalized);
    target.value = '';
    rerenderOutput({ refreshWorkspace: false });
  });
}

function validateTagChipInput(fieldPath, raw) {
  const leaf = String(fieldPath).split('.').at(-1) || '';
  if (leaf.includes('ip') || leaf.includes('cidr')) {
    const cidrOk = /^(?:\d{1,3}\.){3}\d{1,3}\/\d{1,2}$/.test(raw);
    const ipOk = /^(?:\d{1,3}\.){3}\d{1,3}$/.test(raw);
    if (!(cidrOk || ipOk)) return `${fieldPath}: 僅允許 IP 或 CIDR 格式`;
  }
  if (leaf.includes('domain') || leaf.includes('suffix')) {
    const domainOk = /^(?=.{1,253}$)(?:[a-zA-Z0-9](?:[-a-zA-Z0-9]{0,61}[a-zA-Z0-9])?\.)+[A-Za-z]{2,}$/.test(raw);
    if (!domainOk) return `${fieldPath}: 域名格式不合法`;
  }
  return '';
}

function rebuildTagRegistry() {
  const next = {
    inbound: [],
    outbound: [],
    endpoint: [],
    certificate: [],
    certificate_provider: [],
    dns_server: [],
  };
  state.blocksData.forEach((block) => {
    if (!block.active) return;
    const tag = String(getNestedValue(block.values, 'tag') || '').trim();
    if (!tag) return;
    if (block.moduleName === 'inbound') next.inbound.push(tag);
    if (block.moduleName === 'outbound') next.outbound.push(tag);
    if (block.moduleName === 'endpoint') next.endpoint.push(tag);
    if (block.moduleName === 'certificate') {
      if (block.pageId === 'certificate_provider') next.certificate_provider.push(tag);
      else next.certificate.push(tag);
    }
    if (block.moduleName === 'dns' && block.role === 'dns_server') next.dns_server.push(tag);
  });
  Object.keys(next).forEach((key) => { next[key] = [...new Set(next[key])]; });
  state.tagRegistry = next;
}

function resolveReferenceOptions(block, fieldName, spec) {
  const leaf = String(fieldName).split('.').at(-1) || '';
  if (leaf === 'detour' || leaf === 'download_detour' || leaf === 'outbound') return state.tagRegistry.outbound || [];
  if (leaf === 'inbound') return state.tagRegistry.inbound || [];
  if (leaf === 'server' && block.moduleName === 'dns' && block.role === 'dns_rule') return state.tagRegistry.dns_server || [];
  if (leaf.includes('endpoint')) return state.tagRegistry.endpoint || [];
  if (leaf.includes('certificate_provider')) return state.tagRegistry.certificate_provider || [];
  if (leaf.includes('certificate') || fieldName.includes('tls.certificate')) return state.tagRegistry.certificate || [];
  if (spec?.description && /detour|inbound|outbound/i.test(spec.description)) {
    if (/inbound/i.test(spec.description)) return state.tagRegistry.inbound || [];
    return state.tagRegistry.outbound || [];
  }
  return null;
}

function renderField(block, fieldName, spec, depth = 0, breadcrumb = []) {
  if (!shouldRenderField(block, fieldName)) {
    return document.createElement('div');
  }
  const wrap = document.createElement('div');
  wrap.className = 'field';

  const label = document.createElement('label');
  const labelRow = document.createElement('span');
  labelRow.className = 'label-row';
  const labelName = fieldName.includes('.') ? fieldName.split('.').at(-1) : fieldName;
  labelRow.textContent = labelName + (spec.required ? ' *' : '');
  if (spec.description) {
    const icon = document.createElement('span');
    icon.className = 'help-dot';
    icon.title = spec.description;
    icon.textContent = '?';
    label.appendChild(labelRow);
    label.appendChild(icon);
  } else {
    label.appendChild(labelRow);
  }
  wrap.appendChild(label);

  const current = getNestedValue(block.values, fieldName);
  const type = spec?.type;
  const allowed = extractEnumValues(fieldName, spec);
  const references = resolveReferenceOptions(block, fieldName, spec);

  let input;
  if (references?.length && type === 'string') {
    input = document.createElement('select');
    const empty = document.createElement('option');
    empty.value = '';
    empty.textContent = '請選擇已定義 tag';
    input.appendChild(empty);
    references.forEach((v) => {
      const opt = document.createElement('option');
      opt.value = String(v);
      opt.textContent = String(v);
      if (String(current || '') === String(v)) opt.selected = true;
      input.appendChild(opt);
    });
  } else if (allowed?.length) {
    input = document.createElement('select');
    for (const v of allowed) {
      const opt = document.createElement('option');
      opt.value = String(v);
      opt.textContent = String(v);
      if (String(current) === String(v)) opt.selected = true;
      input.appendChild(opt);
    }
  } else if (type === 'boolean') {
    const switchWrap = document.createElement('label');
    switchWrap.className = `switch ${current ? 'on' : ''}`;
    input = document.createElement('input');
    input.type = 'checkbox';
    input.checked = Boolean(current);
    input.addEventListener('change', () => {
      switchWrap.classList.toggle('on', input.checked);
    });
    switchWrap.appendChild(input);
    wrap.appendChild(switchWrap);
  } else if (type === 'array_integer' || type === 'array_string') {
    const list = Array.isArray(current) ? current : [];
    const arrayItemOptions = Array.isArray(spec?.items?.enum) ? spec.items.enum : null;
    const tagWrap = document.createElement('div');
    tagWrap.className = 'tag-input';
    list.forEach((item, idx) => {
      const chip = document.createElement('span');
      chip.className = 'tag';
      chip.innerHTML = `${escapeHtml(String(item))} <button type="button" data-role="tag-remove" data-tag-index="${idx}" data-field-path="${escapeHtml(fieldName)}">×</button>`;
      tagWrap.appendChild(chip);
    });
    input = document.createElement('input');
    input.type = 'text';
    input.className = 'tag-input-editor';
    input.placeholder = type === 'array_integer' ? '輸入數字，回車新增' : '輸入內容，回車新增';
    input.dataset.role = 'tag-editor';
    tagWrap.appendChild(input);
    if (arrayItemOptions?.length) {
      const enumSelect = document.createElement('select');
      enumSelect.innerHTML = '<option value="">選擇預設值追加</option>';
      arrayItemOptions.forEach((option) => {
        const opt = document.createElement('option');
        opt.value = String(option);
        opt.textContent = String(option);
        enumSelect.appendChild(opt);
      });
      enumSelect.addEventListener('change', () => {
        if (!enumSelect.value) return;
        const next = Array.isArray(getNestedValue(block.values, fieldName)) ? [...getNestedValue(block.values, fieldName)] : [];
        const atom = type === 'array_integer' ? Number(enumSelect.value) : enumSelect.value;
        next.push(atom);
        setNestedValue(block.values, fieldName, next);
        enumSelect.value = '';
        rerenderOutput({ refreshWorkspace: false });
      });
      tagWrap.appendChild(enumSelect);
    }
    if (references?.length && type === 'array_string') {
      const refSelect = document.createElement('select');
      refSelect.dataset.role = 'tag-editor';
      refSelect.dataset.blockId = block.id;
      refSelect.dataset.fieldPath = fieldName;
      refSelect.dataset.fieldType = type;
      refSelect.innerHTML = '<option value="">選擇已註冊 tag</option>';
      references.forEach((v) => {
        const opt = document.createElement('option');
        opt.value = v;
        opt.textContent = v;
        refSelect.appendChild(opt);
      });
      refSelect.addEventListener('change', () => {
        if (!refSelect.value) return;
        const next = Array.isArray(getNestedValue(block.values, fieldName)) ? [...getNestedValue(block.values, fieldName)] : [];
        next.push(refSelect.value);
        setNestedValue(block.values, fieldName, next);
        refSelect.value = '';
        rerenderOutput({ refreshWorkspace: false });
      });
      tagWrap.appendChild(refSelect);
    }
    wrap.appendChild(tagWrap);
  } else if (type === 'array_object') {
    const list = Array.isArray(current) ? current : [];
    wrap.appendChild(renderArrayObjectField(block, fieldName, list, spec));
    input = null;
  } else if (type === 'object') {
    const objectWrap = document.createElement('div');
    const objectToggle = document.createElement('label');
    objectToggle.className = 'toggle';
    objectToggle.innerHTML = `<input type="checkbox" ${current !== undefined ? 'checked' : ''}> 啟用 ${escapeHtml(labelName)} 子配置`;
    const objectPanel = document.createElement('fieldset');
    objectPanel.className = 'nested-panel';
    objectPanel.style.setProperty('--depth', String(depth + 1));
    objectPanel.hidden = current === undefined;
    const objectPath = [...breadcrumb, labelName].join(' > ');
    objectPanel.innerHTML = `
      <legend>${escapeHtml(labelName)}</legend>
      <div class="path-chip">${escapeHtml(objectPath)}</div>
    `;
    const objectEditor = document.createElement('textarea');
    objectEditor.placeholder = '{"key":"value"}';
    objectEditor.value = current && typeof current === 'object' ? safeStringify(current, 2) : '{}';
    bindFieldDataset(objectEditor, block.id, fieldName, type);
    objectPanel.appendChild(objectEditor);
    const objectToggleInput = objectToggle.querySelector('input');
    objectToggleInput.dataset.role = 'object-toggle';
    objectToggleInput.dataset.blockId = block.id;
    objectToggleInput.dataset.fieldPath = fieldName;
    objectWrap.appendChild(objectToggle);
    objectWrap.appendChild(objectPanel);
    wrap.appendChild(objectWrap);
    input = null;
  } else {
    input = document.createElement('input');
    input.type = type === 'integer' ? 'number' : 'text';
    input.value = current ?? '';
  }

  if (input) {
    bindFieldDataset(input, block.id, fieldName, type);
    if (!(type === 'boolean' || type === 'array_integer' || type === 'array_string' || type === 'array_object')) {
      wrap.appendChild(input);
    }
  }

  if (spec.description) {
    const hint = document.createElement('div');
    hint.className = 'hint';
    hint.textContent = spec.description;
    wrap.appendChild(hint);
  }

  const fieldErrors = validateField(block, fieldName, getNestedValue(block.values, fieldName), spec);
  const keyErrors = validateShadowsocksKey(block, fieldName, getNestedValue(block.values, fieldName));
  const mergedErrors = [...fieldErrors, ...keyErrors];
  if (mergedErrors.length) {
    wrap.classList.add('invalid');
    const err = document.createElement('div');
    err.className = 'field-error';
    err.textContent = mergedErrors.join('；');
    wrap.appendChild(err);
  }

  return wrap;
}

function shouldRenderField(block, fieldName) {
  if (block.pageId === 'tls') {
    if (fieldName === 'enabled') return true;
    const enabled = getNestedValue(block.values, 'enabled');
    return enabled === true;
  }
  if (String(fieldName).startsWith('tls.') && fieldName !== 'tls.enabled') {
    return getNestedValue(block.values, 'tls.enabled') === true;
  }
  if (block.moduleName === 'dns' && (block.pageId === 'rule' || block.pageId === 'rule_action')) {
    const hasAction = Boolean(getNestedValue(block.values, 'action'));
    const hasServer = Boolean(getNestedValue(block.values, 'server'));
    if (fieldName === 'server') return !hasAction || hasServer;
    if (fieldName === 'action' || fieldName === 'method') return hasAction || !hasServer;
  }
  if (block.moduleName === 'route' && (block.pageId === 'rule' || block.pageId === 'rule_action')) {
    const hasAction = Boolean(getNestedValue(block.values, 'action'));
    const hasOutbound = Boolean(getNestedValue(block.values, 'outbound'));
    if (fieldName === 'outbound') return !hasAction || hasOutbound;
  }
  return true;
}

function getArrayTemplateKey(block, fieldName) {
  return `${block.role}.${fieldName}`;
}

function getArrayObjectTemplates(block, fieldName) {
  return ARRAY_OBJECT_TEMPLATES[getArrayTemplateKey(block, fieldName)] || [];
}

function getArrayObjectItemLabel(fieldName, item, index) {
  if (fieldName === 'rule_set') {
    return item?.tag ? `${item.type || 'rule_set'} · ${item.tag}` : `rule_set #${index + 1}`;
  }
  if (fieldName === 'rules') {
    return item?.action ? `rule_action · ${item.action}` : `rule #${index + 1}`;
  }
  return `item #${index + 1}`;
}

function getArrayObjectVisibleKeys(fieldName, item) {
  const keys = Object.keys(item || {});
  if (fieldName !== 'rule_set') return keys;
  const type = String(item?.type || '').toLowerCase();
  const base = ['type', 'tag', 'format'];
  if (type === 'remote') return [...new Set([...base, 'url', 'download_detour', 'update_interval', 'path', ...keys])];
  if (type === 'inline' || type === 'local') return [...new Set([...base, 'path', 'rules', ...keys])];
  return keys;
}

function parseArrayObjectFieldValue(type, input) {
  if (type === 'boolean') return Boolean(input.checked);
  if (type === 'integer') return Number(input.value || 0);
  if (type === 'array_integer' || type === 'array_string' || type === 'array_object' || type === 'object') {
    try {
      return input.value.trim() ? JSON.parse(input.value) : (type === 'object' ? {} : []);
    } catch {
      return input.value;
    }
  }
  return input.value;
}

function bindArrayItemDrag(card) {
  card.addEventListener('dragstart', (e) => {
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', card.dataset.arrayIndex);
  });
  card.addEventListener('dragover', (e) => {
    e.preventDefault();
    card.classList.add('drag-over');
  });
  card.addEventListener('dragleave', () => card.classList.remove('drag-over'));
  card.addEventListener('drop', (e) => {
    e.preventDefault();
    card.classList.remove('drag-over');
    const block = state.blocksData.find((item) => item.id === card.dataset.blockId);
    if (!block) return;
    const fieldPath = card.dataset.fieldPath;
    const list = getNestedValue(block.values, fieldPath);
    if (!Array.isArray(list)) return;
    const from = Number(e.dataTransfer.getData('text/plain'));
    const to = Number(card.dataset.arrayIndex);
    if (Number.isNaN(from) || Number.isNaN(to) || from === to) return;
    const next = [...list];
    const [moved] = next.splice(from, 1);
    next.splice(to, 0, moved);
    setNestedValue(block.values, fieldPath, next);
    rerenderOutput({ refreshWorkspace: true });
  });
}

function renderArrayObjectItemField(block, fieldPath, itemIndex, key, value) {
  const field = document.createElement('label');
  field.className = 'field';
  const spec = inferSpecFromValue(value);
  const allowed = extractEnumValues(key, spec);
  field.innerHTML = `<span>${escapeHtml(key)}</span>`;
  let input;
  if (allowed?.length) {
    input = document.createElement('select');
    allowed.forEach((v) => {
      const opt = document.createElement('option');
      opt.value = String(v);
      opt.textContent = String(v);
      if (String(value ?? '') === String(v)) opt.selected = true;
      input.appendChild(opt);
    });
  } else if (spec.type === 'boolean') {
    input = document.createElement('input');
    input.type = 'checkbox';
    input.checked = Boolean(value);
  } else if (spec.type === 'integer') {
    input = document.createElement('input');
    input.type = 'number';
    input.value = Number.isFinite(value) ? String(value) : '0';
  } else if (spec.type === 'array_integer' || spec.type === 'array_string' || spec.type === 'array_object' || spec.type === 'object') {
    input = document.createElement('textarea');
    input.value = safeStringify(value ?? (spec.type === 'object' ? {} : []), 2);
    input.placeholder = spec.type === 'object' ? '{"key":"value"}' : '[]';
  } else {
    input = document.createElement('input');
    input.type = 'text';
    input.value = value ?? '';
  }
  input.dataset.role = 'array-object-field';
  input.dataset.blockId = block.id;
  input.dataset.fieldPath = fieldPath;
  input.dataset.itemIndex = String(itemIndex);
  input.dataset.itemKey = key;
  input.dataset.fieldType = spec.type || 'string';
  field.appendChild(input);
  return field;
}

function extractArrayItemSchemaMap(spec) {
  const items = spec?.items;
  if (!items || typeof items !== 'object') return {};
  if (items.properties && typeof items.properties === 'object') return items.properties;
  return Object.fromEntries(
    Object.entries(items).filter(([k]) => !['type', 'description', 'required', 'default'].includes(k))
  );
}

function buildArrayItemFromSchema(spec) {
  const schemaMap = extractArrayItemSchemaMap(spec);
  const item = {};
  Object.entries(schemaMap).forEach(([key, entry]) => {
    item[key] = inferDefault(entry || { type: 'string' });
  });
  return item;
}

function renderArrayObjectField(block, fieldPath, list, spec = {}) {
  const container = document.createElement('div');
  container.className = 'array-object-container';
  const templates = getArrayObjectTemplates(block, fieldPath);
  const itemSchemaMap = extractArrayItemSchemaMap(spec);

  const toolbar = document.createElement('div');
  toolbar.className = 'array-object-toolbar';
  if (templates.length > 1) {
    const select = document.createElement('select');
    select.dataset.role = 'array-template-select';
    select.dataset.blockId = block.id;
    select.dataset.fieldPath = fieldPath;
    templates.forEach((tpl) => {
      const opt = document.createElement('option');
      opt.value = tpl.id;
      opt.textContent = tpl.label;
      select.appendChild(opt);
    });
    toolbar.appendChild(select);
  }
  const addBtn = document.createElement('button');
  addBtn.type = 'button';
  addBtn.className = 'btn';
  addBtn.textContent = '+ Add Item';
  addBtn.dataset.role = 'array-object-add';
  addBtn.dataset.blockId = block.id;
  addBtn.dataset.fieldPath = fieldPath;
  toolbar.appendChild(addBtn);
  container.appendChild(toolbar);

  if (!list.length) {
    const empty = document.createElement('div');
    empty.className = 'array-empty';
    empty.textContent = '尚未新增子積木，點擊 + Add Item 建立。';
    container.appendChild(empty);
  }

  list.forEach((item, index) => {
    const card = document.createElement('article');
    card.className = 'array-item';
    card.draggable = true;
    card.dataset.arrayIndex = String(index);
    card.dataset.blockId = block.id;
    card.dataset.fieldPath = fieldPath;
    card.innerHTML = `
      <div class="array-item-header">
        <strong>${escapeHtml(getArrayObjectItemLabel(fieldPath, item, index))}</strong>
        <button type="button" class="delete" data-role="array-object-delete" data-item-index="${index}">x</button>
      </div>
    `;
    bindArrayItemDrag(card);
    const body = document.createElement('div');
    body.className = 'array-item-grid';
    const keys = getArrayObjectVisibleKeys(fieldPath, item);
    const mergedKeys = [...new Set([...keys, ...Object.keys(itemSchemaMap)])];
    mergedKeys.forEach((key) => {
      body.appendChild(renderArrayObjectItemField(block, fieldPath, index, key, item?.[key]));
    });
    card.appendChild(body);
    container.appendChild(card);
  });

  return container;
}

function bindFieldDataset(input, blockId, fieldPath, type) {
  input.dataset.blockId = blockId;
  input.dataset.fieldPath = fieldPath;
  input.dataset.fieldType = type || 'string';
}

function readInputValue(input, type) {
  if (type === 'boolean') return input.checked;
  if (type === 'integer') return Number(input.value || 0);
  if (type === 'array_integer' || type === 'array_string') return input.value;
  if (type === 'object') {
    try {
      return input.value.trim() ? JSON.parse(input.value) : {};
    } catch {
      return { __parse_error: true, raw: input.value };
    }
  }
  return input.value;
}

function shouldEnforceRequired(block, fieldName) {
  const leaf = String(fieldName).split('.').at(-1) || '';
  const realityEnabled = getNestedValue(block.values, 'reality.enabled') === true
    || getNestedValue(block.values, 'tls.reality.enabled') === true;
  if (['handshake', 'private_key'].includes(leaf)) return false;
  if (['public_key', 'short_id'].includes(leaf)) return realityEnabled;
  if (realityEnabled && ['external_account', 'external_id'].includes(leaf)) return false;

  if (block.moduleName === 'route' && (block.pageId === 'rule' || block.pageId === 'rule_action')) {
    const hasOutbound = Boolean(getNestedValue(block.values, 'outbound'));
    const hasAction = Boolean(getNestedValue(block.values, 'action'));
    const logicalType = String(getNestedValue(block.values, 'type') || '') === 'logical';
    if (leaf === 'action' && hasOutbound && !hasAction) return false;
    if ((leaf === 'mode' || leaf === 'rules') && !logicalType) return false;
  }
  return true;
}

function validateField(block, fieldName, value, spec) {
  const errs = [];
  if (spec.required && shouldEnforceRequired(block, fieldName) && (value === '' || value === null || value === undefined)) {
    errs.push('必填欄位不可為空');
  }
  if (value && typeof value === 'object' && value.__parse_error) errs.push('Object JSON 格式錯誤');
  if (spec.type === 'integer' && value !== '' && value !== null && value !== undefined && typeof value !== 'number') errs.push('需為數字');
  if ((spec.type === 'array_integer' || spec.type === 'array_string' || spec.type === 'array_object') && !Array.isArray(value)) errs.push('需為數組');
  if (typeof value === 'string' && spec.type === 'string') {
    const desc = String(spec.description || '').toLowerCase();
    const leaf = String(fieldName).split('.').at(-1) || '';
    const isIpLike = desc.includes('ip') || leaf.includes('ip') || leaf.includes('range') || leaf.includes('cidr');
    const isCIDRLike = desc.includes('cidr') || leaf.includes('range') || leaf.includes('cidr') || value.includes('/');
    if (isIpLike && value) {
      const ipv4 = /^(?:\d{1,3}\.){3}\d{1,3}$/.test(value);
      const ipv6 = /^[0-9a-fA-F:]+$/.test(value) && value.includes(':');
      const cidrV4 = /^(?:\d{1,3}\.){3}\d{1,3}\/\d{1,2}$/.test(value);
      const cidrV6 = /^[0-9a-fA-F:]+\/\d{1,3}$/.test(value);
      if (isCIDRLike) {
        if (!(cidrV4 || cidrV6 || ipv4 || ipv6)) errs.push('IP/CIDR 格式錯誤');
      } else if (!(ipv4 || ipv6)) {
        errs.push('IP 格式錯誤');
      }
    }
  }
  return errs;
}

function extractEnumValues(fieldName, spec) {
  const leaf = String(fieldName || '').split('.').at(-1);
  if (leaf && Array.isArray(ENUM_FIELD_OPTIONS[leaf])) {
    return ENUM_FIELD_OPTIONS[leaf];
  }
  const candidates = [spec?.allowedValues, spec?.enum, spec?.options, spec?.oneOf];
  for (const candidate of candidates) {
    if (!Array.isArray(candidate) || !candidate.length) continue;
    if (candidate.every((item) => ['string', 'number', 'boolean'].includes(typeof item))) return candidate;
    const constValues = candidate
      .map((item) => (item && typeof item === 'object' && Object.hasOwn(item, 'const') ? item.const : undefined))
      .filter((item) => item !== undefined);
    if (constValues.length) return constValues;
  }
  return null;
}

function validateShadowsocksKey(block, fieldName, value) {
  if (fieldName !== 'password' || block.values.type !== 'shadowsocks') return [];
  const method = String(block.values.method || '');
  const expectedByMethod = {
    '2022-blake3-aes-128-gcm': 16,
    '2022-blake3-aes-256-gcm': 32,
  };
  const expected = expectedByMethod[method];
  if (!expected) return [];
  if (typeof value !== 'string' || !value.trim()) return ['Shadowsocks 2022 密鑰不可為空'];
  try {
    const normalized = value.replace(/-/g, '+').replace(/_/g, '/');
    const decoded = atob(normalized);
    if (decoded.length !== expected) {
      return [`${method} 需要 base64 解碼後 ${expected} 字節，當前 ${decoded.length}`];
    }
  } catch {
    return [`${method} 需要合法 base64 字符串`];
  }
  return [];
}

function migrateLegacy14(result, errors) {
  if (Object.hasOwn(result, 'dns') && Array.isArray(result.dns)) {
    result.dns = { servers: result.dns, rules: [] };
    errors.push('已自動將 dns 陣列遷移為 1.14 對象結構');
  }
  if (Object.hasOwn(result, 'dns') && (!result.dns || typeof result.dns !== 'object')) {
    result.dns = { servers: [], rules: [] };
  }
  if (Object.hasOwn(result, 'dns') && result.dns && typeof result.dns === 'object') {
    if (!Array.isArray(result.dns.servers)) result.dns.servers = [];
    if (!Array.isArray(result.dns.rules)) result.dns.rules = [];
    result.dns.servers = result.dns.servers.map((server) => {
      if (!server || typeof server !== 'object') return server;
      if (typeof server.address === 'string' && !server.type) {
        const migrated = { ...server };
        const address = migrated.address;
        if (address.startsWith('https://')) {
          const url = new URL(address);
          migrated.type = 'https';
          migrated.server = url.hostname;
          migrated.server_port = Number(url.port || 443);
          migrated.path = url.pathname || '/dns-query';
        } else {
          migrated.type = 'udp';
          migrated.server = address;
          migrated.server_port = 53;
        }
        delete migrated.address;
        errors.push('已自動將 legacy dns.address 遷移為 1.14 server/type 結構');
        return migrated;
      }
      return server;
    });
  }

  if (Object.hasOwn(result, 'route') && Array.isArray(result.route)) {
    result.route = { rules: result.route };
    errors.push('已自動將 route 陣列遷移為 1.14 對象結構');
  }
  if (Object.hasOwn(result, 'route') && (!result.route || typeof result.route !== 'object')) {
    result.route = { rules: [] };
  }
  if (Object.hasOwn(result, 'route') && result.route && typeof result.route === 'object') {
    if (!Array.isArray(result.route.rules)) result.route.rules = [];
  }

  for (const key of ROOT_SHARED_KEYS) {
    if (!Object.hasOwn(result, key)) continue;
    const value = result[key];
    const normalizedKey = key === 'v2ray_transport' ? 'transport' : (key === 'mux' ? 'multiplex' : key);
    let migrated = 0;
    for (const section of ['inbounds', 'outbounds', 'endpoints']) {
      const nodes = Array.isArray(result[section]) ? result[section] : [];
      for (const node of nodes) {
        if (!node || typeof node !== 'object' || Object.hasOwn(node, normalizedKey)) continue;
        node[normalizedKey] = structuredClone(value);
        migrated += 1;
      }
    }
    delete result[key];
    if (migrated) {
      errors.push(`已將根級 ${key} 遷移為 inbounds/outbounds/endpoints 子屬性 (${normalizedKey})`);
    } else {
      errors.push(`檢測到非法根級字段 ${key}，但無可遷移主塊，已移除`);
    }
  }
}

function enforceRootWhitelist(result, errors) {
  for (const key of Object.keys(result)) {
    if (ROOT_ALLOWED_KEYS.has(key)) continue;
    delete result[key];
    errors.push(`非法根級字段已移除: ${key}`);
  }
}

function summarizeRules(result) {
  const rules = result.route?.rules || [];
  const items = [];
  if (rules.some(r => Array.isArray(r.geosite) && r.geosite.includes('cn'))) items.push('中國流量直連');
  const yt = rules.find(r => (r.domain_suffix || []).some(d => d.includes('youtube')));
  if (yt?.outbound) items.push(`YouTube 走 ${yt.outbound}`);
  const ad = rules.find(r => (r.domain_suffix || []).some(d => d.includes('ad')));
  if (ad?.outbound) items.push(`廣告流量走 ${ad.outbound}`);
  const ai = rules.find(r => (r.domain_suffix || []).some(d => d.includes('openai') || d.includes('anthropic')));
  if (ai?.outbound) items.push(`AI 流量走 ${ai.outbound}`);
  return items.length ? `規則摘要：${items.join('，')}` : '規則摘要：已生成配置，但未匹配到可摘要的分流規則。';
}

function buildMergedConfig() {
  let result = {};
  const errors = [...state.errors];
  const payloadByBlockId = new Map();

  for (const block of state.blocksData) {
    if (!block.active) continue;
    const payload = { ...(block.basePayload || {}) };

    for (const [name, spec] of Object.entries(block.fields)) {
      const value = getNestedValue(block.values, name);
      if (!shouldRenderField(block, name)) continue;
      const fieldErrors = validateField(block, name, value, spec);
      const keyErrors = validateShadowsocksKey(block, name, value);
      const allErrors = [...fieldErrors, ...keyErrors];
      if (allErrors.length) {
        errors.push(`${block.title}.${name}: ${allErrors.join(', ')}`);
        continue;
      }
      if (!shouldPersistFieldValue(block, name, value, spec)) continue;
      setPayloadValue(payload, name, value);
    }
    payloadByBlockId.set(block.id, payload);
  }

  for (const block of state.blocksData) {
    if (!block.active) continue;
    const payload = payloadByBlockId.get(block.id) || {};

    const bucket = ARRAY_BUCKETS[block.moduleName];
    if (bucket === 'inbounds' || bucket === 'outbounds' || bucket === 'endpoints' || bucket === 'services') {
      if (!Array.isArray(result[bucket])) result[bucket] = [];
      result[bucket].push(payload);
    } else if (bucket === 'dns') {
      if (!result.dns || typeof result.dns !== 'object' || Array.isArray(result.dns)) result.dns = {};
      if (block.role === 'dns_server') {
        if (!Array.isArray(result.dns.servers)) result.dns.servers = [];
        result.dns.servers.push(payload);
      } else if (block.role === 'dns_rule') {
        if (!Array.isArray(result.dns.rules)) result.dns.rules = [];
        result.dns.rules.push(payload);
      } else {
        Object.assign(result.dns, payload);
      }
    } else if (bucket === 'route') {
      if (!result.route || typeof result.route !== 'object' || Array.isArray(result.route)) result.route = {};
      if (block.role === 'route_rule') {
        if (!Array.isArray(result.route.rules)) result.route.rules = [];
        result.route.rules.push(payload);
      } else {
        Object.assign(result.route, payload);
      }
    } else if (['log', 'experimental', 'dns', 'route', 'ntp', 'certificate'].includes(block.moduleName)) {
      if (!result[block.moduleName] || typeof result[block.moduleName] !== 'object' || Array.isArray(result[block.moduleName])) {
        result[block.moduleName] = {};
      }
      Object.assign(result[block.moduleName], payload);
    } else if (block.moduleName === 'shared') {
      const target = payloadByBlockId.get(block.parentId);
      const nestedKey = SHARED_PAGE_TO_PROPERTY[block.pageId] || block.pageId;
      if (!target) {
        errors.push(`${block.title}: Shared 模塊未綁定 inbound/outbound/endpoint，已忽略`);
        continue;
      }
      if (!['tls', 'transport', 'multiplex', 'multipath'].includes(nestedKey)) {
        errors.push(`${block.title}: Shared 模塊字段 ${nestedKey} 不在允許清單中，已忽略`);
        continue;
      }
      target[nestedKey] = payload;
    } else {
      if (!result[block.moduleName]) result[block.moduleName] = [];
      result[block.moduleName].push(payload);
    }
  }

  for (const key of Object.keys(result)) {
    if (Array.isArray(result[key]) && result[key].length === 0) delete result[key];
  }
  result = pruneEmpty(result) || {};
  migrateLegacy14(result, errors);
  enforceRootWhitelist(result, errors);

  return { result, errors };
}

function shouldPersistFieldValue(block, name, value, spec) {
  if (value === null || value === undefined || value === '') return false;
  if (Array.isArray(value) && value.length === 0 && getNestedValue(block.basePayload || {}, name) === undefined) return false;
  if (typeof value === 'object' && !Array.isArray(value) && Object.keys(value).length === 0 && getNestedValue(block.basePayload || {}, name) === undefined) return false;
  const defaultValue = inferDefault(spec);
  const fromBase = getNestedValue(block.basePayload || {}, name);
  if (fromBase !== undefined) return true;
  return JSON.stringify(value) !== JSON.stringify(defaultValue);
}

function pruneEmpty(input) {
  if (Array.isArray(input)) {
    const normalized = input
      .map((item) => pruneEmpty(item))
      .filter((item) => item !== undefined);
    return normalized.length ? normalized : undefined;
  }
  if (!input || typeof input !== 'object') {
    if (input === '' || input === null || input === false || input === 0) return undefined;
    return input;
  }

  const output = {};
  Object.entries(input).forEach(([key, value]) => {
    if (key.startsWith('__')) return;
    const normalized = pruneEmpty(value);
    if (normalized === undefined) return;
    output[key] = normalized;
  });

  return Object.keys(output).length ? output : undefined;
}

function stripJsonComments(text) {
  let out = '';
  let inString = false;
  let escaped = false;
  let inLineComment = false;
  let inBlockComment = false;
  for (let i = 0; i < text.length; i += 1) {
    const ch = text[i];
    const next = text[i + 1];
    if (inLineComment) {
      if (ch === '\n') {
        inLineComment = false;
        out += ch;
      }
      continue;
    }
    if (inBlockComment) {
      if (ch === '*' && next === '/') {
        inBlockComment = false;
        i += 1;
      }
      continue;
    }
    if (!inString && ch === '/' && next === '/') {
      inLineComment = true;
      i += 1;
      continue;
    }
    if (!inString && ch === '#') {
      inLineComment = true;
      continue;
    }
    if (!inString && ch === '/' && next === '*') {
      inBlockComment = true;
      i += 1;
      continue;
    }
    out += ch;
    if (ch === '"' && !escaped) inString = !inString;
    escaped = ch === '\\' && !escaped;
    if (ch !== '\\') escaped = false;
  }
  return out;
}

async function importConfig(jsonString) {
  const raw = String(jsonString || '').trim();
  if (!raw) return;
  const parsed = JSON.parse(stripJsonComments(raw));
  const normalized = await normalizeImportedConfig(parsed);
  state.blocksData = [];
  syncUIFromCurrentConfig(normalized);
  renderWorkspace();
  rerenderOutput({ refreshWorkspace: false });
}

function setPayloadValue(payload, path, value) {
  if (!String(path).includes('.')) {
    payload[path] = value;
    return;
  }
  setNestedValue(payload, path, value);
}

function getNestedValue(obj, path) {
  return String(path).split('.').reduce((acc, segment) => (
    acc && typeof acc === 'object' ? acc[segment] : undefined
  ), obj);
}

function setNestedValue(obj, path, value) {
  const segments = String(path).split('.');
  let cursor = obj;
  for (let i = 0; i < segments.length - 1; i += 1) {
    const key = segments[i];
    if (!cursor[key] || typeof cursor[key] !== 'object') cursor[key] = {};
    cursor = cursor[key];
  }
  cursor[segments.at(-1)] = value;
}

function deleteNestedValue(obj, path) {
  const segments = String(path).split('.');
  let cursor = obj;
  for (let i = 0; i < segments.length - 1; i += 1) {
    cursor = cursor?.[segments[i]];
    if (!cursor || typeof cursor !== 'object') return;
  }
  delete cursor?.[segments.at(-1)];
}

function resolveRootKeyByModule(moduleName) {
  const map = {
    endpoint: 'endpoints',
    inbound: 'inbounds',
    outbound: 'outbounds',
    service: 'services',
  };
  return map[moduleName] || moduleName;
}

function rerenderOutput(options = {}) {
